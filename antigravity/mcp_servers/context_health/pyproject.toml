[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-health-mcp"
version = "0.1.0"
description = "Phase 2 context health and anti-context-rot telemetry MCP service"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.27.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["context_health"]
