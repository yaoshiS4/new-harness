# Wayland Native & Fcitx5 / Vietnamese IME
--ozone-platform=wayland
--enable-wayland-ime
--wayland-text-input-version=3

# Intel Iris Xe Hardware Acceleration & Zero-Copy Video Frames (keeps NVIDIA dGPU asleep in D3cold)
--render-node-override=/dev/dri/by-path/pci-0000:00:02.0-render
--enable-gpu-rasterization
--enable-zero-copy
--enable-gpu-memory-buffer-video-frames
--disallow-non-exact-resource-reuse
--gpu-sandbox-start-early

# Networking, HTTP/3 QUIC & Smooth Scrolling
--enable-quic
--enable-smooth-scrolling

# Extension & Tab Ergonomics (uBlock Origin + Violentmonkey + Scroll To Top)
--extension-mime-request-handling=always-prompt-for-install
--disable-extensions-http-throttling
--enable-tab-audio-muting

# Native Zero-Overhead Dark Mode (CIELAB Hue-Preserving, Zero Image Inversion)
--force-dark-mode

# Chromium 156 + Helium Verified Hardware Video, Extension Proxy, Performance, UI & Security Features
--enable-features=AcceleratedVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,VaapiLowPowerEncoderGen9x,ZeroCopyDesktopCapture,HEVCRextCodecStringParsing,MediaRecorderHEVCSupport,OptimizeWebRequestProxy,OptimizeWebRequestProxyForServiceWorkerAutoPreload,WaylandTextInputV3,ParallelDownloading,BackForwardCache,SmoothScrolling,OverlayScrollbar,MiddleClickAutoscroll,HappyEyeballsV3,MemorySaverModeRenderTuning,JXLImageFormat,StrictOriginIsolation,OriginAgentClusterDefaultEnabled,HttpsFirstBalancedMode,HttpsUpgrades,RustyJpegFeature,RustyIcoFeature,WebRtcHideLocalIpsWithMdns,WebRtcPqcForDtls,WebCryptoPQC,HeliumNoise,HeliumNoiseCanvas,HeliumNoiseAudio,HeliumNoiseCpuCores,HeliumSplitClientHello,FingerprintingCanvasMeasureTextNoise,FingerprintingClientRectsNoise,X25519MLKEM768,UseDnsHttpsSvcb,SplitCacheByNetworkIsolationKey,SideBySide,SplitViewDragAndDropVelocity,TabHoverCardImages,TabSearchPerformanceImprovements,VerticalTabsExpandOnHover,HeliumNativeFrameMaterials,Accelerated2dCanvas,V8FlushBaselineCode,WebAssemblyLazyCompilation,WebAssemblyTiering,DarkenWebsitesCheckboxInThemesSetting,WebContentsForceDark:inversion_method/cielab_based/image_behavior/none/foreground_lightness_threshold/187/background_lightness_threshold/205

# Privacy, Telemetry, Tracking & Ad-Tech Mitigation
--disable-features=AutofillServerCommunication,BrowsingTopics,OptimizationHints,AdInterestGroupAPI,Fledge,AttributionReporting
--disable-breakpad
--disable-field-trial-config
--no-pings
--no-default-browser-check
--no-first-run
