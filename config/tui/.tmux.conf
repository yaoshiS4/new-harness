# General Settings
# Zero-width Unicode format characters (agy inline-code wrap markers U+FFF9..U+FFFB & soft hyphen)
set -g -s codepoint-widths[0] "U+FFF9-U+FFFB=0"
set -g -s codepoint-widths[1] "U+00AD=0"
set -g -s codepoint-widths[2] "U+2060-U+2064=0"
set -g -s codepoint-widths[3] "U+FEFF=0"

set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -s set-clipboard on
set -g bell-action none
set -g visual-bell off
set -g activity-action none

# Wayland Clipboard & Copy Toast Integration
set -s copy-command "$HOME/.local/bin/wl-copy"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi a send-keys -X cancel
bind -T copy-mode-vi MouseUp1Pane send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel
bind -T root MouseDown1Pane if-shell -F -t = "#{&&:#{mouse_any_flag},#{!=:#{pane_index},1}}" { send-keys -M } { select-pane -t = ; send-keys -M }

# CachyOS Emerald Dark Styling
set -g status-position bottom
set -g status-interval 3
set -g status-style "bg=#12151a,fg=#ecf0f4"
set -g message-style "bg=#20252d,fg=#ecf0f4,bold"
set -g message-command-style "bg=#20252d,fg=#3b82f6,bold"
setw -g mode-style "bg=#264f78,fg=#ecf0f4,bold"
set -g copy-mode-match-style "bg=#20252d,fg=#60a5fa,bold"
set -g copy-mode-current-match-style "bg=#3b82f6,fg=#12151a,bold"
set -g status-left-length 40
set -g status-left "#[bg=#3b82f6,fg=#12151a,bold] 🚀 #S #[bg=#12151a,fg=#3b82f6] "
set -g status-right-length 120
set -g status-right "#[fg=#60a5fa]󰘳 Alt+p:Cmd  Alt+b:Side  Alt+d:Diff  Alt+t:Tree  Alt+o:Jump  Alt+g:Git  Alt+y:Yazi  Alt+=:Eq  Alt+←/→:Pane "
set -g window-status-format "#[fg=#949ca6] #I:#W "
set -g window-status-current-format "#[bg=#20252d,fg=#3b82f6,bold] #I:#W* "
set -g pane-border-style "fg=#20252d"
set -g pane-active-border-style "fg=#3b82f6"
set -g popup-border-style "fg=#3b82f6"
set -g popup-border-lines rounded

# Global No-Prefix OpenCode TUI Hotkeys (Alt+Key) - 100% Toggle-on / Toggle-off
bind -n M-p run-shell "$HOME/.local/bin/agy-squad --toggle-popup p '#{pane_current_path}' $HOME/.local/bin/agy-squad --command-palette"
bind -n M-b run-shell "$HOME/.local/bin/agy-squad --toggle-sidebar"
bind -n M-B run-shell "$HOME/.local/bin/agy-squad --sidebar-rail"
bind -n M-s run-shell "$HOME/.local/bin/agy-squad --toggle-sidebar"
bind -n M-d run-shell "$HOME/.local/bin/agy-squad --toggle-popup d '#{pane_current_path}' $HOME/.local/bin/agy-squad --diff-popup"
bind -n M-g run-shell "$HOME/.local/bin/agy-squad --toggle-popup g '#{pane_current_path}' lazygit"
bind -n M-y run-shell "$HOME/.local/bin/agy-squad --toggle-popup y '#{pane_current_path}' yazi"
bind -n M-t run-shell "$HOME/.local/bin/agy-squad --toggle-popup t '#{pane_current_path}' $HOME/.local/bin/agy-squad --tree-popup"
bind -n M-o run-shell "$HOME/.local/bin/agy-squad --toggle-popup o '#{pane_current_path}' $HOME/.local/bin/agy-squad --jump-attention"
bind -n M-= run-shell "$HOME/.local/bin/agy-squad --equalize-splits"

# Fast No-Prefix Pane & Worktree Window Navigation (Alt+Key)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
